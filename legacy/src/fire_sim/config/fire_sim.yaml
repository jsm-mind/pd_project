# Shared by fire_generator and alarm_simulator
/**:
  ros__parameters:
    # Candidate fire positions [x1, y1, x2, y2, ...] in map frame (== Gazebo world).
    # Each is >= 0.5 m away from walls and furniture.
    candidates: [
      0.7, 2.8,    # 0 living room, west
      3.8, 0.7,    # 1 living room, south
      4.5, 3.8,    # 2 living room, north
      7.0, 0.7,    # 3 kitchen, south
      8.9, 3.8,    # 4 kitchen, north
      0.8, 5.3,    # 5 bedroom 1, door side
      3.2, 6.6,    # 6 bedroom 1, desk side
      5.0, 7.3,    # 7 hall
      7.3, 5.3,    # 8 bedroom 2, door side
      7.2, 7.3,    # 9 bedroom 2, wardrobe side
    ]

fire_generator:
  ros__parameters:
    world_name: house
    wait_for_patrol: true   # start the first delay on /patrol/started
    min_delay: 30.0   # [s] random delay before each fire (after patrol start / after extinguish)
    max_delay: 120.0
    fire_index: -1    # >= 0: always this candidate (scenario tests), -1: random

alarm_simulator:
  ros__parameters:
    # Smoke detector per candidate (same order). No detector: the fire raises no alarm
    # and must be found by the normal patrol.
    has_detector: [true, true, true, true, true, true, true, false, true, false]
    on_delay_min: 20.0   # [s] fire spawn -> alarm on (smoke reaching the detector)
    on_delay_max: 40.0
    off_delay: 10.0      # [s] fire extinguished -> alarm off
    # False alarm scenario: alarm without a fire, timed from /patrol/started
    false_alarm: false
    false_alarm_start: 60.0
    false_alarm_duration: 90.0   # [s] <= 0: never ends

fire_manager:
  ros__parameters:
    world_name: house
    robot_name: fire_robot
    max_hp: 100.0
    damage_rate: 10.0      # [HP/s] while spraying is effective
    min_distance: 1.0      # [m] robot center to fire center
    max_distance: 2.0
    max_angle_deg: 10.0    # robot heading vs. direction to fire
