patrol:
  ros__parameters:
    # Patrol loop, flat list of [x, y, yaw] in map frame
    waypoints: [
      3.0, 2.8, -0.1,     # living room (faces TV stand)
      2.6, 6.0, 3.14,     # kitchen (faces stove 1)
      4.75, 5.3, 1.57,    # utility room entrance
      6.2, 5.2, 1.57,     # hall (bathroom entrance)
      8.4, 5.3, 0.0,      # bedroom 2
      9.0, 3.7, 3.14,     # corridor
      7.5, 1.5, 0.0,      # bedroom 1
    ]
    charger: [0.6, 3.6, 0.0]
    auto_start: true       # start_patrol once Nav2 is up (time-based trigger later)
    dock_tolerance: 0.05   # AMCL distance to pad center [m]; pad r=0.3, robot r=0.21, AMCL err ~0.04

evacuation:
  ros__parameters:
    # Resident search: visit nearest first, spin 360 deg at each ([x, y] flat)
    search_points: [
      3.0, 2.8,     # living room
      2.6, 6.0,     # kitchen
      4.75, 5.3,    # utility room entrance
      6.2, 5.2,     # hall
      8.4, 5.3,     # bedroom 2
      9.0, 3.7,     # corridor
      7.5, 1.5,     # bedroom 1
    ]
    exit: [4.2, 1.55, -1.57]   # living room floor just before the genkan step, facing the front door
                               # (genkan is keepout in the map); the resident walks on out to the assembly point
    approach_dist: 1.0
    turn_clearance: 0.25       # [m] approach stop: no inscribed/lethal costmap cell this close to its
                               # center (robot center >= ~0.47 m from obstacles, room to turn and leave)
    voice_period: 8.0
    guide_speed: 0.8           # [m/s] while leading the resident (search: full speed)

suppression:
  ros__parameters:
    standoff: 0.3          # [m] from the estimated fire point (lidar hit on its front);
                           # robot (r 0.22) edge stops ~0.08 m off the furniture
    fire_out_delay: 5.0    # [s] after release, the fire model is removed
    cloud_time: 20.0       # [s] aerosol cloud visual lifetime
    release_radius: 1.5    # [m] standoff unreachable but this close to the fire -> release there
